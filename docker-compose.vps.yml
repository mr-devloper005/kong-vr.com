services:
  msfq5yds11:
    container_name: msfq5yds11_app
    image: ghcr.io/mr-devloper005/kong-vr.com:latest
    env_file:
      - .env
    network_mode: bridge
    restart: always
    ports:
      - "127.0.0.1:3253:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5m
      timeout: 3s
      retries: 2
